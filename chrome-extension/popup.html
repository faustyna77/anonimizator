<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymizer Prawniczy</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; width: 320px; padding: 14px; margin: 0; color: #1a1a2e; background: #f7f8fa; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #0b0c15; }
    label { display: block; font-size: 12px; font-weight: 600; margin-top: 9px; }
    input { box-sizing: border-box; width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #c5c8d0; border-radius: 6px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2c3e50; color: #fff; font-weight: 600; cursor: pointer; margin-top: 12px; }
    button:disabled, fieldset:disabled button { cursor: not-allowed; opacity: 0.55; }
    fieldset { border: 0; padding: 0; margin: 0; }
    .status { font-size: 12px; margin-top: 10px; min-height: 18px; color: #333; }
    .session { font-size: 12px; margin: 0; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Anonymizer Prawniczy</h1>
  <p id="sessionState" class="session" hidden></p>

  <form id="loginForm">
    <fieldset id="loginFields">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Zaloguj</button>
    </fieldset>
  </form>

  <button id="logoutButton" type="button" hidden>Wyloguj</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
